name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: connecthub_test
          POSTGRES_PASSWORD: connecthub_test
          POSTGRES_DB: connecthub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U connecthub_test -d connecthub_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://unused:unused@localhost:5432/connecthub_ci_app
      TEST_DATABASE_URL: postgresql+psycopg://connecthub_test:connecthub_test@localhost:5432/connecthub_test
      ALLOWED_ORIGINS: '["http://localhost:5173"]'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - name: Upgrade disposable test database
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: python -m alembic upgrade head
      - run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit
      - run: npm audit --omit=dev

  browser-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: connecthub_test
          POSTGRES_PASSWORD: connecthub_test
          POSTGRES_DB: connecthub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U connecthub_test -d connecthub_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://unused:unused@localhost:5432/connecthub_ci_app
      TEST_DATABASE_URL: postgresql+psycopg://connecthub_test:connecthub_test@localhost:5432/connecthub_test
      ALLOWED_ORIGINS: '["http://127.0.0.1:5174"]'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements.lock
      - run: python -m alembic upgrade head
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend

