[project]
name = "connecthub-backend"
version = "0.1.0"
description = "ConnectHub modular-monolith backend foundation"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic==1.20.1",
  "argon2-cffi==25.1.0",
  "email-validator==2.4.0",
  "fastapi==0.163.1",
  "httpx==0.28.1",
  "pydantic==2.14.3",
  "pydantic-settings==2.16.3",
  "psycopg==3.3.9",
  "sqlalchemy[asyncio]==2.1.8",
  "uvicorn==0.54.0",
  "websockets==17.4",
]

[project.optional-dependencies]
dev = [
  "pytest==9.2.0",
  "pytest-asyncio==1.5.0",
  "ruff==0.17.5",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
  "integration: requires a positively identified disposable PostgreSQL test database",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

